<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 緑〜アンバー（黄金）〜赤のグラデーション -->
    <linearGradient id="tenplaTransparentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />   <!-- エメラルドグリーン -->
      <stop offset="35%" stop-color="#34d399" />  <!-- ライトグリーン -->
      <stop offset="55%" stop-color="#f59e0b" />  <!-- アンバー/ゴールド -->
      <stop offset="85%" stop-color="#f43f5e" />  <!-- ローズレッド -->
      <stop offset="100%" stop-color="#e11d48" /> <!-- ディープクリムゾン -->
    </linearGradient>

    <!-- シンボルの立体感を出すソフトシャドウ -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- メインシンボル（背景なし・透過） -->
  <g filter="url(#softGlow)">
    <!-- Tの水平バー（ヘッダーブロック） -->
    <rect x="116" y="128" width="280" height="68" rx="20" fill="url(#tenplaTransparentGrad)" />

    <!-- Tの垂直ステム（レイヤードブロック） -->
    <rect x="222" y="214" width="68" height="96" rx="18" fill="url(#tenplaTransparentGrad)" opacity="0.95" />
    <rect x="222" y="328" width="68" height="68" rx="18" fill="url(#tenplaTransparentGrad)" opacity="0.8" />

    <!-- 拡張スロット（点線ガイド枠） -->
    <rect x="116" y="214" width="88" height="88" rx="18" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
    <rect x="308" y="214" width="88" height="88" rx="18" fill="none" stroke="#f43f5e" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
  </g>
</svg>
