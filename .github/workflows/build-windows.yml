name: Build Windows Application

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: # 手動実行トリガー

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1. Python環境構築 & バックエンドの exe 化
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Backend Executable with PyInstaller
        run: |
          cd backend
          pyinstaller --noconsole --onefile run_server.py --name backend-server

      # ----------------------------------------------------
      # 2. Sidecar 用ディレクトリへのバイナリ配置
      # ----------------------------------------------------
      - name: Stage Sidecar Binary for Tauri
        shell: pwsh
        run: |
          # Tauriが要求するターゲットトリプル名（x86_64-pc-windows-msvc）を付与
          $targetTriple = "x86_64-pc-windows-msvc"
          $binDir = "frontend/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir

          Copy-Item -Path "backend/dist/backend-server.exe" -Destination "$binDir/backend-server-$targetTriple.exe"
          Get-ChildItem -Path $binDir

      # ----------------------------------------------------
      # 3. Node.js & Rust 環境のセットアップ
      # ----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      # ----------------------------------------------------
      # 4. フロントエンド依存関係のインストール & ビルド
      # ----------------------------------------------------
      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      # ----------------------------------------------------
      # 5. Tauri アプリケーションのビルド (.exe / .msi)
      # ----------------------------------------------------
      - name: Build Tauri App
        run: |
          cd frontend
          npm run build
          npx tauri build

      # ----------------------------------------------------
      # 6. 生成されたインストーラー・exe を Artifacts にアップロード
      # ----------------------------------------------------
      - name: Upload Windows Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TenPla-Windows-Installer
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
