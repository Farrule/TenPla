name: Build Windows Application

on:
  release:
    types: [published] # Release Please 等でリリースが公開された時
  workflow_dispatch: # 手動実行トリガー
    inputs:
      target_tag:
        description: "アップロード先の Release タグ名 (未指定の場合は 'latest')"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write # Releaseの作成・アセット更新に必須

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1. Python環境構築 & バックエンドの exe 化
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Backend Executable with PyInstaller
        run: |
          cd backend
          pyinstaller --noconsole --onefile --name backend-server --add-data "app;app" run_server.py

      # ----------------------------------------------------
      # 2. Sidecar 用ディレクトリへのバイナリ配置
      # ----------------------------------------------------
      - name: Stage Sidecar Binary for Tauri
        shell: pwsh
        run: |
          $targetTriple = "x86_64-pc-windows-msvc"
          $binDir = "frontend/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir

          Copy-Item -Path "backend/dist/backend-server.exe" -Destination "$binDir/backend-server-$targetTriple.exe" -Force
          Get-ChildItem -Path $binDir

      # ----------------------------------------------------
      # 3. Node.js & Rust 環境のセットアップ
      # ----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      # ----------------------------------------------------
      # 4. フロントエンド依存関係のインストール & ビルド
      # ----------------------------------------------------
      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      # ----------------------------------------------------
      # 5. Tauri アプリケーションのビルド (.exe / .msi)
      # ----------------------------------------------------
      - name: Build Tauri App
        run: |
          cd frontend
          npm run build
          npx tauri build

      # ----------------------------------------------------
      # 6. 生成されたインストーラーを Artifacts にアップロード（無圧縮）
      # ----------------------------------------------------
      - name: Upload Windows Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TenPla-Windows-Installer
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0
          if-no-files-found: error

      # ----------------------------------------------------
      # 7. アップロード先タグ名の解決ステップ
      # ----------------------------------------------------
      - name: Resolve Target Tag
        id: resolve-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            TARGET_TAG="${{ inputs.target_tag }}"
            if [ -z "$TARGET_TAG" ]; then
              TARGET_TAG="latest"
            fi
            echo "tag_name=$TARGET_TAG" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------
      # 8. GitHub Releases への高速アップロード
      # ----------------------------------------------------
      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag_name }}
          files: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          prerelease: false
          # すでに同名のアセットが存在する場合は上書き
          overwrite: true
          # 該当タグの Release がまだ存在しない場合は自動作成
          make_latest: ${{ steps.resolve-tag.outputs.tag_name == 'latest' && 'true' || 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
