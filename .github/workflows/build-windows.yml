name: Build Windows Application

on:
  release:
    types: [published] # Release Pleaseによってリリースが公開された時にトリガー
  workflow_dispatch: # 手動実行トリガー

permissions:
  contents: write # Releaseにアセットをアップロードするために必要

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1. Python環境構築 & バックエンドの exe 化
      # ----------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Backend Executable with PyInstaller
        run: |
          cd backend
          pyinstaller --noconsole --onefile --name backend-server --add-data "app;app" run_server.py

      # ----------------------------------------------------
      # 2. Sidecar 用ディレクトリへのバイナリ配置
      # ----------------------------------------------------
      - name: Stage Sidecar Binary for Tauri
        shell: pwsh
        run: |
          $targetTriple = "x86_64-pc-windows-msvc"
          $binDir = "frontend/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir

          Copy-Item -Path "backend/dist/backend-server.exe" -Destination "$binDir/backend-server-$targetTriple.exe" -Force
          Get-ChildItem -Path $binDir

      # ----------------------------------------------------
      # 3. Node.js & Rust 環境のセットアップ
      # ----------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      # ----------------------------------------------------
      # 4. フロントエンド依存関係のインストール & ビルド
      # ----------------------------------------------------
      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      # ----------------------------------------------------
      # 5. Tauri アプリケーションのビルド (.exe / .msi)
      # ----------------------------------------------------
      - name: Build Tauri App
        run: |
          cd frontend
          npm run build
          npx tauri build

      # ----------------------------------------------------
      # 6. 生成されたインストーラーを Artifacts にアップロード（無圧縮で高速化）
      # ----------------------------------------------------
      - name: Upload Windows Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TenPla-Windows-Installer
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0 # 二重圧縮を回避して処理とダウンロードを高速化
          if-no-files-found: error

      # ----------------------------------------------------
      # 7. GitHub Releases にアップロード (CDN経由で超高速ダウンロード)
      # ----------------------------------------------------
      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
